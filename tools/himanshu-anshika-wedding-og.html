<!DOCTYPE html>
<!-- Link-preview cover for public/himanshu-anshika-wedding (1200×630). Rendered with headless Chrome at a 1200×630
     viewport and saved as public/himanshu-anshika-wedding/assets/cover-25nov2026.jpg.
     Everything that matters sits in the middle 600 px, so WhatsApp's square thumbnail (a centre crop) still shows the
     monogram, both names, the date and the place; the invitation's painted flowers frame the wide version, mirrored
     so both sides match. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cinzel:wght@600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ecd4ba; }
  .half { position: absolute; top: 0; width: 600px; height: 630px; overflow: hidden; }
  .half img { position: absolute; left: 0; top: -40px; width: 1200px; }
  .half.r { left: 600px; transform: scaleX(-1); }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 36% 66% at 50% 50%, rgba(246, 231, 208, .97), rgba(246, 231, 208, .78) 62%, rgba(246, 231, 208, 0)); }
  .rim { position: absolute; inset: 14px; border: 1.5px solid rgba(169, 122, 43, .55); border-radius: 6px; }
  .rim::after { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(169, 122, 43, .3); border-radius: 3px; }
  .card { position: absolute; left: 300px; width: 600px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .mono { width: 168px; height: 168px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 36% 28%, #5a2d1c, #2a130b 62%, #1b0c07);
    box-shadow: 0 0 0 5px #f8e7c2, 0 0 0 7px #b98a2e, 0 0 0 12px rgba(248, 231, 194, .55), 0 12px 26px rgba(80, 40, 20, .35); }
  .mono img { width: 90%; height: 90%; display: block; }
  .n { margin-top: 34px; font: 700 47px/1.1 Cinzel, serif; letter-spacing: .07em; padding-left: .07em; color: #6e1630; white-space: nowrap; }
  .n b { font: 400 66px/.7 'Pinyon Script', cursive; color: #9a6c22; margin: 0 .14em; letter-spacing: 0; }
  .w { margin-top: 2px; font: 60px/1.15 'Pinyon Script', cursive; color: #8a5a1c; }
  .line { display: flex; align-items: center; gap: 12px; width: 300px; margin: 6px 0 12px; }
  .line i { flex: 1; height: 1.5px; background: linear-gradient(to right, transparent, #c99a46); } .line i + s + i { transform: scaleX(-1); }
  .line s { width: 8px; height: 8px; transform: rotate(45deg); background: #b98a2e; }
  .d { font: 700 30px Cinzel, serif; letter-spacing: .12em; padding-left: .12em; color: #6e1630; }
  .p { margin-top: 8px; font: 600 20px Cinzel, serif; letter-spacing: .34em; padding-left: .34em; color: #9a6c22; }
</style></head>
<body>
  <div class="half"><img src="../public/himanshu-anshika-wedding/assets/bg/p4.webp" alt=""></div>
  <div class="half r"><img src="../public/himanshu-anshika-wedding/assets/bg/p4.webp" alt=""></div>
  <div class="glow"></div><div class="rim"></div>
  <div class="card">
    <div class="mono"><img src="../public/himanshu-anshika-wedding/assets/el/ha-logo.webp" alt=""></div>
    <div class="n">HIMANSHU<b>&amp;</b>ANSHIKA</div>
    <div class="w">Wedding Invitation</div>
    <div class="line"><i></i><s></s><i></i></div>
    <div class="d">25 NOVEMBER 2026</div>
    <div class="p">ROHINI, DELHI</div>
  </div>
</body></html>
