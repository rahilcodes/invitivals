<!DOCTYPE html>
<!-- The SR monogram for the wax seal of public/dr-snehal-dr-rushikesh-wedding: white on black, a 600 × 600 field at
     the left of a 1200 × 630 page (rendered with headless Chrome, the left 600 × 600 is the shape the film tool
     presses into the wax). S above and to the left, R below and to the right, as the design's own seal set its two
     letters; R is cut clear of S by a hairline so the two read as interlocked, not merged. Font: Marcellus. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: M; src: url('../../node_modules/@fontsource/marcellus/files/marcellus-latin-400-normal.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #000; overflow: hidden; }
  .f { position: absolute; left: 0; top: 0; width: 600px; height: 600px; }
  .f span { position: absolute; font: 400 330px/1 M, serif; color: #fff; }
  .s { left: 155px; top: 90px; }
  .r { left: 252px; top: 196px; -webkit-text-stroke: 16px #000; paint-order: stroke fill; }
</style></head>
<body><div class="f"><span class="s">S</span><span class="r">R</span></div></body></html>
