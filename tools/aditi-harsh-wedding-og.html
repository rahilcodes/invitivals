<!DOCTYPE html>
<!-- Link-preview cover for public/aditi-harsh-wedding (1200×630). Rendered with headless Chrome at a 1200×630 viewport,
     saved as public/aditi-harsh-wedding/assets/cover-aditi-harsh.jpg (progressive JPEG).
     One centred composition: the invitation's own temple pond at sunset (assets/finale.webp) behind, a warm ivory glow in the middle, and the
     Ganpati, the names, the two dates and the venue on the centre line — so WhatsApp's wide preview and its small square crop both show the
     names whole. Give the file a new name whenever it changes (WhatsApp keeps a preview per image address). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Pinyon+Script&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f4e4ca; }

  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 36% 58% at 50% 46%, rgba(250, 239, 218, .97), rgba(250, 239, 218, .88) 55%, rgba(250, 239, 218, .3) 84%, rgba(250, 239, 218, 0)); }
  .rim { position: absolute; inset: 16px; border: 1.5px solid rgba(184, 137, 50, .6); border-radius: 6px; }
  .rim::after { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(184, 137, 50, .32); border-radius: 3px; }
  .couple { position: absolute; bottom: -4px; height: 300px; filter: drop-shadow(0 10px 14px rgba(74, 14, 24, .3)); }
  .couple.l { left: 64px; } .couple.r { right: 64px; transform: scaleX(-1); }
  .card { position: absolute; left: 290px; width: 620px; top: 0; bottom: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .g { height: 150px; margin-bottom: 10px; filter: drop-shadow(0 8px 12px rgba(74, 14, 24, .3)); }
  .k { font: 600 19px Cinzel, serif; letter-spacing: .4em; padding-left: .4em; color: #8c621d; }
  .n { margin-top: 10px; font: 700 104px/1 'Cormorant Garamond', serif; letter-spacing: .01em; white-space: nowrap;
    background: linear-gradient(100deg, #6e4a12, #a97a26 28%, #d9b770 50%, #a07021 72%, #6e4a12); -webkit-background-clip: text; color: transparent; padding: 0 .06em .06em; }
  .n i { font: 400 96px/1 'Pinyon Script', cursive; color: #8a2a2e; -webkit-text-fill-color: #8a2a2e; margin: 0 .12em 0 .06em; vertical-align: .02em; }
  .t { margin-top: 2px; font: italic 500 30px 'Cormorant Garamond', serif; color: #651522; }
  .line { display: flex; align-items: center; gap: 12px; width: 360px; margin: 16px 0 14px; }
  .line i { flex: 1; height: 1.5px; background: linear-gradient(to right, transparent, #b88932); } .line i + s + i { transform: scaleX(-1); }
  .line s { width: 9px; height: 9px; transform: rotate(45deg); background: #b88932; }
  .d { font: 700 34px Cinzel, serif; letter-spacing: .12em; padding-left: .12em; color: #651522; }
  .p { margin-top: 8px; font: italic 600 25px 'Cormorant Garamond', serif; color: #6a4b35; }
</style></head>
<body>
  <div class="art"></div>
  <div class="top"></div>
  <div class="glow"></div>
  <div class="rim"></div>
  <div class="card">
    <img class="g" src="../public/aditi-harsh-wedding/assets/ganesha.webp" alt="">
    <div class="k">WEDDING INVITATION</div>
    <div class="n">Aditi<i>&amp;</i>Harsh</div>
        <div class="line"><i></i><s></s><i></i></div>
    <div class="d">11 &amp; 12 JANUARY 2027</div>
    <div class="p">Krushnakunj Mandapam</div>
  </div>
</body></html>
