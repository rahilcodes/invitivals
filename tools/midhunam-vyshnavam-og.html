<!DOCTYPE html>
<!-- the link-preview cover of /midhunam-vyshnavam/ (1200 x 630), from the invitation's own artwork and fonts.
     Rendered with headless Chrome at a 1200 x 630 viewport → public/midhunam-vyshnavam/og-cover.jpg (progressive JPEG).
     The middle 630 px square holds everything that matters, so WhatsApp's square crop keeps it. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:CG;font-weight:500;font-style:italic;src:url(../public/midhunam-vyshnavam/fonts/f1.woff2)}
@font-face{font-family:CG;font-weight:500 700;src:url(../public/midhunam-vyshnavam/fonts/f2.woff2)}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:CG,Georgia,serif;color:#7a4a12;text-align:center;
  background:radial-gradient(90% 120% at 50% 45%,#fbf3df 0%,#f3e5c8 60%,#e8d2a4 100%)}
.frame{position:absolute;inset:16px;border:2px solid #c9a35c;box-shadow:inset 0 0 0 6px #f6ecd6,inset 0 0 0 7px rgba(201,163,92,.6)}
.scene{position:absolute;left:50%;bottom:17px;width:640px;transform:translateX(-50%)}
.words{position:absolute;left:50%;top:38px;width:620px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.c{font-size:76px;font-weight:600;color:#8a4a1a;line-height:1.02}
.s{font-size:28px;font-style:italic;margin-top:2px}
.h{font-size:44px;font-weight:700;letter-spacing:2px;color:#9c3d2e;line-height:1.1;margin-top:6px;white-space:nowrap}
.rule{display:flex;align-items:center;gap:14px;margin:6px 0 2px}
.rule i{display:block;width:120px;height:1.5px;background:linear-gradient(90deg,rgba(201,163,92,0),#c9a35c)}
.rule i:last-child{transform:scaleX(-1)}
.rule img{width:38px;mix-blend-mode:multiply}
.d{font-size:31px;font-weight:700;letter-spacing:1px}
</style></head><body>
<img class="scene" src="../public/midhunam-vyshnavam/assets/footer-scene.webp" alt="">
<div class="frame"></div>
<div class="words">
  <div class="c">Gruhapravesham</div>
  <div class="s">Of Our New Homes</div>
  <div class="h">MIDHUNAM &amp; VYSHNAVAM</div>
  <div class="rule"><i></i><img src="../public/midhunam-vyshnavam/assets/lotus.webp" alt=""><i></i></div>
  <div class="d">Friday, 20 November 2026</div>
</div>
</body></html>
