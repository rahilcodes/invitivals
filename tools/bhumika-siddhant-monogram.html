<!DOCTYPE html>
<!-- STAND-IN monogram for Bhumika & Siddhant (2026-11-18): the client's own B–S monogram was named in the brief but
     did not arrive, so the envelope's seal carries these two letters until it does. Open at 900 x 900 and save as
     invites/src/saicharan-lakshmi-engagement/bs-logo.jpg (gold on black, which the seal tools key out).
     When the real monogram arrives: put it there under the same name (on black) and re-run the seal, film and init. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 900px; height: 900px; background: #000; overflow: hidden; }
  .ring { position: absolute; inset: 60px; border-radius: 50%; border: 9px solid #d9b25c; }
  .ring::after { content: ''; position: absolute; inset: 22px; border-radius: 50%; border: 3px solid #c79a45; }
  .l { position: absolute; font: 600 400px/1 'Cormorant Garamond', serif; background: linear-gradient(160deg, #f6e2a4, #d5ab52 45%, #b28533 75%, #e8cc85); -webkit-background-clip: text; color: transparent; }
  .b { left: 196px; top: 190px; }
  .s { left: 478px; top: 322px; }
  .a { position: absolute; left: 0; right: 0; top: 356px; text-align: center; font: 400 150px/1 'Pinyon Script', cursive; color: #e7c97e; }
</style></head>
<body><div class="ring"></div><div class="l b">B</div><div class="l s">S</div><div class="a">&amp;</div></body></html>
