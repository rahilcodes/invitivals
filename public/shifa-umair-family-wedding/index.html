<!-- Preload only what the guest sees first: envelope, main invitation, next screen -->
<link rel="preload" as="image" href="assets/intro-poster.jpg" fetchpriority="high">
<link rel="preload" as="image" href="assets/screens/main.jpg">
<link rel="preload" as="image" href="assets/screens/messageFamily.jpg">
<link rel="preload" as="image" href="assets/layers/butterfly.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="is-sealed">

<!-- ENVELOPE: the design's opening film, ending on the empty arch; the invitation's own arch (the couple) dissolves in -->
<div id="envelope" class="envelope" role="button" tabindex="0" aria-label="Open the invitation">
  <div class="envelope__col">
    <div class="envelope__stage">
      <video id="introVideo" class="envelope__video" src="assets/intro-video.mp4" poster="assets/intro-poster.jpg"
             playsinline webkit-playsinline preload="auto" aria-hidden="true"></video>
      <div class="envelope__seal" aria-hidden="true"><span></span></div>
      <p class="envelope__hint" aria-hidden="true">Tap the seal to open</p>
    </div>
    <button id="introSkip" class="envelope__skip" type="button" tabindex="-1">Skip</button>
  </div>
</div>

<!-- ONE CONTINUOUS SCROLLABLE INVITATION (paintings: tools/shifa-umair-art.mjs; this file: tools/shifa-umair-pages.mjs) -->
<main id="invitation" class="invitation">

  <section id="main" class="sec sec--dark" style="--W:793;--H:1600" data-petals="5" data-sparkles="10">
    <div class="art">
      <img src="assets/screens/main.jpg" width="793" height="1600" alt="In the name of Allah, the Most Gracious, the Most Merciful. Together with our families, Shifa and Mohammad Umair. Together in faith, forever in love. You are warmly invited to our wedding celebrations." decoding="async" fetchpriority="high">
      <i class="glow" style="--gx:5%;--gy:39%;--gs:36"></i>
      <i class="glow" style="--gx:94%;--gy:30%;--gs:36"></i>
      <i class="glow" style="--gx:90%;--gy:67%;--gs:30"></i>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <section id="invite" class="sec sec--light" style="--W:733;--H:1100" data-petals="3" data-sparkles="6">
    <div class="art">
      <img src="assets/screens/messageFamily.jpg" width="733" height="1100" alt="You’re invited. With immense gratitude to Allah (SWT), we are delighted to invite you and your family to the wedding of our daughter Shifa with Mohammad Umair on Saturday, 26th December 2026. Your presence and sincere duas are the greatest blessings we could ask for as they begin this new chapter together. Parvez and Nazima. Shifa, daughter of Parvez and Nazima. Mohammad Umair, son of Shahnawaz and Roomana." loading="lazy" decoding="async">
      <i class="glow" style="--gx:50%;--gy:11%;--gs:34"></i>
      <i class="glow" style="--gx:96%;--gy:58%;--gs:30"></i>
    </div>
  </section>

  <section id="scratch" class="sec sec--dark" style="--W:900;--H:1600" data-petals="4" data-sparkles="10">
    <div class="art">
      <img src="assets/screens/scratch.jpg" width="900" height="1600" alt="A date written for us. Scratch to reveal our special date." loading="lazy" decoding="async">
      <i class="glow" style="--gx:8%;--gy:21%;--gs:38"></i>
      <i class="glow" style="--gx:14%;--gy:37%;--gs:20"></i>
      <div class="ov ticket" style="--x:122;--y:735;--w:658;--h:330">
        <div class="ticket__reveal" id="ticketReveal">
          <p class="ticket__label">Save the Date</p>
          <p class="ticket__date" id="ticketDate"></p>
          <p class="ticket__full" id="ticketFull"></p>
        </div>
        <canvas id="scratchCanvas" class="ticket__canvas" role="button" tabindex="0" aria-label="Scratch to reveal our special date. Press Enter to reveal."></canvas>
        <div class="ticket__burst" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section id="functions" class="sec sec--light" style="--W:689;--H:1600" data-petals="4" data-sparkles="6">
    <div class="art">
      <img src="assets/screens/functions.jpg" width="689" height="1600" alt="Our Functions. Three beautiful occasions, one blessed journey: Rang-e-Noor, Tuesday 22 December; Qubool Hai, Thursday 24 December; Dawat-e-Ishq, Saturday 26 December. Your presence will make our days more special." loading="lazy" decoding="async">
      <i class="glow" style="--gx:7%;--gy:24%;--gs:34"></i>
      <button class="ov hotspot hotspot--plaque" data-fn="rangeNoor" style="--x:80;--y:614;--w:520;--h:136" aria-label="Rang-e-Noor details"><i></i></button>
      <button class="ov hotspot hotspot--plaque" data-fn="quboolHai" style="--x:80;--y:804;--w:520;--h:136" aria-label="Qubool Hai details"><i></i></button>
      <button class="ov hotspot hotspot--plaque" data-fn="dawat" style="--x:80;--y:994;--w:520;--h:136" aria-label="Dawat-e-Ishq details"><i></i></button>
    </div>
  </section>

  <section id="countdown" class="sec sec--dark" style="--W:628;--H:1600" data-petals="4" data-sparkles="14">
    <div class="art">
      <img src="assets/screens/countdown.jpg" width="628" height="1600" alt="The wait is almost over. Some moments are worth the wait." loading="lazy" decoding="async">
      <i class="glow" style="--gx:50.6%;--gy:8%;--gs:40"></i>
      <i class="glow" style="--gx:6%;--gy:84%;--gs:34"></i>
      <i class="glow" style="--gx:93%;--gy:85.5%;--gs:34"></i>
      <div class="ov cd" style="--x:31;--y:500;--w:123;--h:186"><b id="cdDays">00</b><span>Days</span></div>
      <div class="ov cd" style="--x:178;--y:500;--w:123;--h:186"><b id="cdHours">00</b><span>Hours</span></div>
      <div class="ov cd" style="--x:326;--y:500;--w:123;--h:186"><b id="cdMins">00</b><span>Minutes</span></div>
      <div class="ov cd" style="--x:474;--y:500;--w:123;--h:186"><b id="cdSecs">00</b><span>Seconds</span></div>
      <a class="ov hotspot hotspot--save" id="calSave"    style="--x:88;--y:973;--w:452;--h:102" href="#" aria-label="Save our date to Google Calendar"><i></i></a>
      <a class="ov hotspot hotspot--icon" id="calGoogle"  style="--x:85;--y:1132;--w:130;--h:142" href="#" target="_blank" rel="noopener" aria-label="Add to Google Calendar"></a>
      <a class="ov hotspot hotspot--icon" id="calApple"   style="--x:245;--y:1132;--w:130;--h:142" href="#" aria-label="Add to Apple Calendar"></a>
      <a class="ov hotspot hotspot--icon" id="calOutlook" style="--x:410;--y:1132;--w:130;--h:142" href="#" target="_blank" rel="noopener" aria-label="Add to Outlook Calendar"></a>
    </div>
  </section>

  <section id="thanks" class="sec sec--light" style="--W:733;--H:560" data-petals="3" data-sparkles="6">
    <div class="art">
      <img src="assets/screens/thanksFamily.jpg" width="733" height="560" alt="Thank you. We sincerely thank you for being a part of our happiness. Your presence, love and blessings will make these celebrations even more memorable. With love, Parvez and Nazima." loading="lazy" decoding="async">
      <i class="glow" style="--gx:50%;--gy:40%;--gs:30"></i>
    </div>
  </section>

  <section id="quran" class="sec sec--dark" style="--W:995;--H:1581" data-petals="4" data-sparkles="16">
    <div class="art">
      <img src="assets/screens/quran.jpg" width="995" height="1581" alt="And of everything We created pairs so that you may remember. Surah Az-Zariyat 51:49." loading="lazy" decoding="async">
      <i class="glow" style="--gx:79%;--gy:79%;--gs:40"></i>
      <i class="glow" style="--gx:60%;--gy:15%;--gs:30"></i>
      <i class="glow" style="--gx:27.6%;--gy:15%;--gs:22"></i>
    </div>
  </section>

</main>

<!-- FUNCTION DETAIL (in-place overlay, the invitation stays alive underneath) -->
<div id="fnOverlay" class="fn" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Function details">
  <div class="fn__scroll" id="fnScroll">
    <div class="fn__col">
      <button class="fn__back" id="fnBack" type="button" aria-label="Back to Our Functions">
        <svg viewBox="0 0 18 12" aria-hidden="true"><path d="M6.5 1 1.5 6l5 5M2 6h15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <article class="fn__page sec--light" data-fn="rangeNoor" data-scene="rangeNoor" data-petals="1" data-sparkles="4" style="--W:709;--H:1600">
        <div class="art">
          <img data-src="assets/screens/rangeNoor.jpg" width="709" height="1600" alt="Rang-e-Noor." decoding="async">
          <div class="ov info info--ink" data-ev="rangeNoor" style="--x:140;--y:486;--w:430;--h:312;--gap:12;--fd:37;--ft:34;--fv:36"><span class=" rise" data-date></span><span class=" rise" data-times></span><span class=" rise" data-venue></span><span class=" rise" data-dress></span></div>
          <a class="ov maps rise" data-maps="rangeNoor" style="--x:160;--y:816;--w:390;--h:80;--mf:27" target="_blank" rel="noopener"><i></i><svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.2 12 30 12 30s12-9.8 12-18.3C24 5.2 18.6 0 12 0zm0 16.4a4.7 4.7 0 1 1 0-9.4 4.7 4.7 0 0 1 0 9.4z" fill="currentColor"/></svg><span>View on Google Maps</span></a>
          <a class="ov maps maps--cal rise" data-gcal="rangeNoor" style="--x:160;--y:910;--w:390;--h:80;--mf:27" target="_blank" rel="noopener"><i></i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 9.5h19M7.5 2v5M16.5 2v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="6.5" y="13" width="4" height="4" rx=".8" fill="currentColor"/></svg><span>Add to Calendar</span></a>
        </div>
      </article>

      <article class="fn__page sec--dark" data-fn="quboolHai" data-scene="quboolHai" data-petals="6" data-sparkles="12" style="--W:761;--H:1600">
        <div class="art">
          <img data-src="assets/screens/quboolHai.jpg" width="761" height="1600" alt="Nikah. Qubool Hai. A sacred bond in the sight of Allah." decoding="async">
          <div class="ov info info--gold" data-ev="quboolHai" style="--x:176;--y:644;--w:410;--h:108;--gap:3;--fd:33;--ft:28"><span class=" rise" data-date></span><span class=" rise" data-times></span></div>
          <div class="ov info info--gold" data-ev="quboolHai" style="--x:150;--y:766;--w:462;--h:130;--gap:8;--fv:34;--fdc:24"><span class=" rise" data-venue></span><span class=" rise" data-dress></span></div>
          <a class="ov maps rise" data-maps="quboolHai" style="--x:186;--y:1296;--w:390;--h:80;--mf:27" target="_blank" rel="noopener"><i></i><svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.2 12 30 12 30s12-9.8 12-18.3C24 5.2 18.6 0 12 0zm0 16.4a4.7 4.7 0 1 1 0-9.4 4.7 4.7 0 0 1 0 9.4z" fill="currentColor"/></svg><span>View on Google Maps</span></a>
          <a class="ov maps maps--cal rise" data-gcal="quboolHai" style="--x:186;--y:1392;--w:390;--h:80;--mf:27" target="_blank" rel="noopener"><i></i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 9.5h19M7.5 2v5M16.5 2v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="6.5" y="13" width="4" height="4" rx=".8" fill="currentColor"/></svg><span>Add to Calendar</span></a>
        </div>
      </article>

      <article class="fn__page sec--dark" data-fn="dawat" data-scene="dawat" data-petals="2" data-sparkles="14" data-sparkle-top="1" style="--W:761;--H:1600">
        <div class="art">
          <img data-src="assets/screens/dawat.jpg" width="761" height="1600" alt="Dawat-e-Ishq. An evening of blessings, good food and togetherness." decoding="async">
          <div class="ov info info--ink" data-ev="dawat" style="--x:160;--y:950;--w:440;--h:116;--gap:6;--fd:38;--ft:34"><span class=" rise" data-date></span><span class=" rise" data-times></span></div>
          <div class="ov info info--ink" data-ev="dawat" style="--x:160;--y:1084;--w:440;--h:130;--gap:8;--fv:38;--fdc:26"><span class="info__lbl rise">Venue</span><span class=" rise" data-venue></span><span class=" rise" data-dress></span></div>
          <a class="ov maps rise" data-maps="dawat" style="--x:186;--y:1240;--w:390;--h:84;--mf:27" target="_blank" rel="noopener"><i></i><svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.2 12 30 12 30s12-9.8 12-18.3C24 5.2 18.6 0 12 0zm0 16.4a4.7 4.7 0 1 1 0-9.4 4.7 4.7 0 0 1 0 9.4z" fill="currentColor"/></svg><span>View on Google Maps</span></a>
          <a class="ov maps maps--cal rise" data-gcal="dawat" style="--x:186;--y:1378;--w:390;--h:84;--mf:27" target="_blank" rel="noopener"><i></i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 9.5h19M7.5 2v5M16.5 2v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="6.5" y="13" width="4" height="4" rx=".8" fill="currentColor"/></svg><span>Add to Calendar</span></a>
        </div>
      </article>
    </div>
  </div>
</div>

<!-- the only global fixed control -->
<button id="muteBtn" class="mute" type="button" aria-label="Mute music" aria-pressed="false" hidden>
  <svg class="mute__on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4z" fill="currentColor"/><path d="M15 8.6a4.6 4.6 0 0 1 0 6.8M17.4 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>

</button>
