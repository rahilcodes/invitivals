<body class="is-sealed">

<!-- ============================================================
     ENVELOPE (fixed only while sealed, removed after opening)
     ============================================================ -->
<div id="envelope" class="envelope" role="button" tabindex="0" aria-label="Open the invitation">
  <div class="envelope__col">
    <div class="envelope__stage">
      <div class="envelope__whole"></div>
      <div class="envelope__door envelope__door--l"></div>
      <div class="envelope__door envelope__door--r"></div>
      <div class="envelope__seal" aria-hidden="true"><span></span></div>
      <div class="envelope__burst" aria-hidden="true"></div>
      <p class="envelope__hint" aria-hidden="true">Tap the seal to open</p>
    </div>
    <div class="envelope__light" aria-hidden="true"></div>
  </div>
</div>

<!-- ============================================================
     ONE CONTINUOUS SCROLLABLE INVITATION
     Each section owns a real height through its artwork aspect ratio.
     ============================================================ -->
<main id="invitation" class="invitation">

  <!-- MAIN · CHANCHAL & JP -->
  <section id="main" class="sec sec--dark" style="--W:793;--H:1600" data-petals="5" data-sparkles="10">
    <div class="art">
      <img src="assets/screens/main.jpg" width="793" height="1600" alt="Shri Ganeshaya Namah. With the divine blessings of Shri Ganesh ji and our elders, together with our families, Chanchal and JP. Two hearts, one journey, forever in love. A photograph of Chanchal and JP at Jal Mahal. You are warmly invited to our wedding celebrations." decoding="async" fetchpriority="high">
      <i class="glow" style="--gx:5%;--gy:39%;--gs:36"></i>
      <i class="glow" style="--gx:94%;--gy:30%;--gs:36"></i>
      <i class="glow" style="--gx:90%;--gy:67%;--gs:30"></i>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <!-- SCRATCH DATE -->
  <section id="scratch" class="sec sec--dark" style="--W:900;--H:1600" data-petals="4" data-sparkles="10">
    <div class="art">
      <img src="assets/screens/scratch.jpg" width="900" height="1600" alt="Chanchal and JP. A date written for us. Scratch to reveal our special date. Shubh Vivah." decoding="async">
      <i class="glow" style="--gx:8%;--gy:21%;--gs:38"></i>
      <i class="glow" style="--gx:14%;--gy:37%;--gs:20"></i>

        </div>
        <canvas id="scratchCanvas" class="ticket__canvas" role="button" tabindex="0" aria-label="Scratch to reveal our special date. Press Enter to reveal."></canvas>
        <div class="ticket__burst" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- OUR FUNCTIONS -->

      <i class="glow" style="--gx:95%;--gy:56%;--gs:30"></i>
