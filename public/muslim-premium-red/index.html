<!-- Preload only what the guest sees first: envelope, main invitation, next screen -->
<link rel="preload" as="image" href="assets/intro-poster.jpg" fetchpriority="high">
<link rel="preload" as="image" href="assets/screens/main.jpg">
<link rel="preload" as="image" href="assets/screens/scratch.jpg">
<link rel="preload" as="image" href="assets/layers/butterfly.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body class="is-sealed">

<!-- ============================================================
     ENVELOPE (fixed only while sealed, removed after opening)
     ============================================================ -->
<div id="envelope" class="envelope" role="button" tabindex="0" aria-label="Open the invitation">
  <div class="envelope__col">
    <div class="envelope__stage">
      <video id="introVideo" class="envelope__video" src="assets/intro-video.mp4" poster="assets/intro-poster.jpg"
             playsinline webkit-playsinline preload="auto" aria-hidden="true"></video>
      <div class="envelope__seal" aria-hidden="true"><span></span></div>
      <p class="envelope__hint" aria-hidden="true">Tap the seal to open</p>
    </div>
    <button id="introSkip" class="envelope__skip" type="button" tabindex="-1">Skip</button>
  </div>
</div>

<!-- ============================================================
     ONE CONTINUOUS SCROLLABLE INVITATION
     Each section owns a real height through its artwork aspect ratio.
     ============================================================ -->
<main id="invitation" class="invitation">

  <!-- MAIN · AHMAD & LAYLA -->
  <section id="main" class="sec sec--dark" style="--W:793;--H:1600" data-petals="5" data-sparkles="10">
    <div class="art">
      <img src="assets/screens/main.jpg" width="793" height="1600" alt="In the name of Allah, the Most Gracious, the Most Merciful. Together with our families, Ahmad and Layla. Together in faith, forever in love. You are warmly invited to our wedding celebrations." decoding="async" fetchpriority="high">
      <i class="glow" style="--gx:5%;--gy:39%;--gs:36"></i>
      <i class="glow" style="--gx:94%;--gy:30%;--gs:36"></i>
      <i class="glow" style="--gx:90%;--gy:67%;--gs:30"></i>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <!-- SCRATCH DATE -->
  <section id="scratch" class="sec sec--dark" style="--W:900;--H:1600" data-petals="4" data-sparkles="10">
    <div class="art">
      <img src="assets/screens/scratch.jpg" width="900" height="1600" alt="A date written for us. Scratch to reveal our special date." decoding="async">
      <i class="glow" style="--gx:8%;--gy:21%;--gs:38"></i>
      <i class="glow" style="--gx:14%;--gy:37%;--gs:20"></i>


      <div class="ov ticket" style="--x:122;--y:735;--w:658;--h:330">
        <div class="ticket__reveal" id="ticketReveal">
          <p class="ticket__label">Save the Date</p>
          <p class="ticket__date" id="ticketDate">13 · 02 · 2027</p>
          <p class="ticket__full" id="ticketFull">Saturday, 13 February 2027</p>
        </div>
        <canvas id="scratchCanvas" class="ticket__canvas" role="button" tabindex="0" aria-label="Scratch to reveal our special date. Press Enter to reveal."></canvas>
        <div class="ticket__burst" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- OUR FUNCTIONS -->
  <section id="functions" class="sec sec--light" style="--W:689;--H:1600" data-petals="4" data-sparkles="6">
    <div class="art">
      <img src="assets/screens/functions.jpg" width="689" height="1600" alt="Our Functions. Four beautiful occasions, one blessed journey. Your presence will make our days more special." loading="lazy" decoding="async">
      <i class="glow" style="--gx:7%;--gy:24%;--gs:34"></i>

      <!-- corrected lettering over the artwork -->
      <div class="ov patch patch--plaque" style="--x:322;--y:741;--w:212;--h:72"></div>
      <div class="ov plaque-text" style="--x:298;--y:728;--w:260;--h:100;--fs:78"><span>Sanchak</span></div>
      <div class="ov patch patch--plaque" style="--x:322;--y:898;--w:210;--h:100"></div>
      <div class="ov plaque-text" style="--x:300;--y:898;--w:260;--h:100"><span>Shadi</span></div>

      <button class="ov hotspot hotspot--plaque" data-fn="manje"   style="--x:80;--y:548;--w:520;--h:140" aria-label="Manje details"><i></i></button>
      <button class="ov hotspot hotspot--plaque" data-fn="sanchak" style="--x:80;--y:715;--w:520;--h:140" aria-label="Sanchak details"><i></i></button>
      <button class="ov hotspot hotspot--plaque" data-fn="shadi"   style="--x:80;--y:882;--w:520;--h:140" aria-label="Shadi details"><i></i></button>
      <button class="ov hotspot hotspot--plaque" data-fn="valima"  style="--x:80;--y:1048;--w:520;--h:140" aria-label="Valima details"><i></i></button>
    </div>
  </section>

  <!-- COUNTDOWN + SAVE OUR DATE -->
  <section id="countdown" class="sec sec--dark" style="--W:628;--H:1600" data-petals="4" data-sparkles="14">
    <div class="art">
      <img src="assets/screens/countdown.jpg" width="628" height="1600" alt="The wait is almost over. Some moments are worth the wait." loading="lazy" decoding="async">
      <i class="glow" style="--gx:50.6%;--gy:8%;--gs:40"></i>
      <i class="glow" style="--gx:6%;--gy:84%;--gs:34"></i>
      <i class="glow" style="--gx:93%;--gy:85.5%;--gs:34"></i>

      <div class="ov cd" style="--x:31;--y:500;--w:123;--h:186"><b id="cdDays">00</b><span>Days</span></div>
      <div class="ov cd" style="--x:178;--y:500;--w:123;--h:186"><b id="cdHours">00</b><span>Hours</span></div>
      <div class="ov cd" style="--x:326;--y:500;--w:123;--h:186"><b id="cdMins">00</b><span>Minutes</span></div>
      <div class="ov cd" style="--x:474;--y:500;--w:123;--h:186"><b id="cdSecs">00</b><span>Seconds</span></div>

      <a class="ov hotspot hotspot--save" id="calSave"    style="--x:88;--y:973;--w:452;--h:102" href="#" aria-label="Save our date to your calendar"><i></i></a>
      <a class="ov hotspot hotspot--icon" id="calGoogle"  style="--x:85;--y:1132;--w:130;--h:142" href="#" target="_blank" rel="noopener" aria-label="Add to Google Calendar"></a>
      <a class="ov hotspot hotspot--icon" id="calApple"   style="--x:245;--y:1132;--w:130;--h:142" href="#" aria-label="Add to Apple Calendar"></a>
      <a class="ov hotspot hotspot--icon" id="calOutlook" style="--x:410;--y:1132;--w:130;--h:142" href="#" target="_blank" rel="noopener" aria-label="Add to Outlook Calendar"></a>
    </div>
  </section>

  <!-- DUA -->
  <section id="dua" class="sec sec--light" style="--W:733;--H:1600" data-petals="4" data-sparkles="6">
    <div class="art">
      <img src="assets/screens/dua.jpg" width="733" height="1600" alt="BarakAllahu lakuma. Dua for the couple. Your heartfelt duas mean the world to us. Thank you for being a part of our journey. Ahmad and Layla." loading="lazy" decoding="async">
      <i class="glow" style="--gx:50%;--gy:7.5%;--gs:34"></i>
      <i class="glow" style="--gx:96%;--gy:40%;--gs:30"></i>
      <i class="glow" style="--gx:95%;--gy:56%;--gs:30"></i>

      <form id="duaForm" class="dua" novalidate>
        <div class="ov dua__box" style="--x:135;--y:669;--w:463;--h:147">
          <label class="vh" for="duaText">Write your dua</label>
          <textarea id="duaText" maxlength="500" placeholder="Write your dua here..." autocomplete="off"></textarea>
          <div class="dua__thanks" id="duaThanks" aria-live="polite" hidden>
            <strong>JazakAllah Khair</strong>
            <span>Your dua has reached our hearts.</span>
            <button type="button" id="duaAgain">Write another</button>
          </div>
        </div>
        <div class="ov dua__count" style="--x:500;--y:828;--w:108;--h:26"><span id="duaCount">0</span>/500</div>
        <button class="ov hotspot hotspot--send" type="submit" style="--x:210;--y:856;--w:312;--h:86" aria-label="Send dua"><i></i></button>
        <p class="ov dua__msg" id="duaMsg" style="--x:135;--y:946;--w:463;--h:30" role="status"></p>
      </form>
    </div>
  </section>

  <!-- QUR'AN ENDING -->
  <section id="quran" class="sec sec--dark" style="--W:995;--H:1581" data-petals="4" data-sparkles="16">
    <div class="art">
      <img src="assets/screens/quran.jpg" width="995" height="1581" alt="And of everything We created pairs so that you may remember. Surah Az-Zariyat 51:49." loading="lazy" decoding="async">
      <i class="glow" style="--gx:79%;--gy:79%;--gs:40"></i>
      <i class="glow" style="--gx:60%;--gy:15%;--gs:30"></i>
      <i class="glow" style="--gx:27.6%;--gy:15%;--gs:22"></i>
    </div>
  </section>

</main>

<!-- ============================================================
     FUNCTION DETAIL (in-place overlay, invitation stays alive underneath)
     ============================================================ -->
<div id="fnOverlay" class="fn" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Function details">
  <div class="fn__scroll" id="fnScroll">
    <div class="fn__col">
      <button class="fn__back" id="fnBack" type="button" aria-label="Back to Our Functions">

        Back
      </button>

      <!-- Every date, time, venue line and Maps link below is filled from CONFIG in js/app.js -->
      <article class="fn__page sec--dark" data-fn="manje" data-scene="manje" data-petals="3" data-sparkles="8" style="--W:659;--H:1600">
        <div class="art">
          <img data-src="assets/screens/manje.jpg" width="659" height="1600" alt="Manje. A day of traditions, love and haldi. Let the colours of love begin." decoding="async">

          <i class="glow" style="--gx:92%;--gy:27%;--gs:38"></i>

          <div class="ov when when--cream" style="--x:100;--y:672;--w:460;--h:98"><span class="rise" data-date></span><span class="rise" data-time></span></div>

          <div class="ov venue when--cream" style="--x:100;--y:866;--w:460;--h:82;--vn:38;--va:29"><span class="rise" data-venue-name></span><span class="rise" data-venue-addr></span></div>
          <a class="ov maps rise" data-maps style="--x:185;--y:956;--w:290;--h:54;--mf:24" target="_blank" rel="noopener"><i></i><svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.2 12 30 12 30s12-9.8 12-18.3C24 5.2 18.6 0 12 0zm0 16.4a4.7 4.7 0 1 1 0-9.4 4.7 4.7 0 0 1 0 9.4z" fill="currentColor"/></svg><span>View on Google Maps</span></a>
        </div>
      </article>

      <article class="fn__page sec--light" data-fn="sanchak" data-scene="sanchak" data-petals="1" data-sparkles="4" style="--W:709;--H:1600">
        <div class="art">
          <img data-src="assets/screens/sanchak.jpg" width="709" height="1600" alt="Sanchak. A celebration of colours, music and togetherness. Dhol, dance and dil se masti." decoding="async">
          <i class="glow glow--flame" style="--gx:17%;--gy:61%;--gs:26"></i>
          <i class="glow" style="--gx:93%;--gy:69%;--gs:30"></i>
          <div class="ov patch" style="--x:165;--y:632;--w:388;--h:94;--c:linear-gradient(#f2d7b7,#f0d3b0)"></div>
          <div class="ov when when--ink" style="--x:125;--y:630;--w:460;--h:98"><span class="rise" data-date></span><span class="rise" data-time></span></div>
          <div class="ov patch" style="--x:185;--y:772;--w:350;--h:140;--c:linear-gradient(#eecfab,#eac69f)"></div>
          <div class="ov venue when--ink" style="--x:125;--y:774;--w:460;--h:78;--vn:40;--va:30"><span class="rise" data-venue-name></span><span class="rise" data-venue-addr></span></div>
          <a class="ov maps rise" data-maps style="--x:205;--y:860;--w:300;--h:54;--mf:25" target="_blank" rel="noopener"><i></i><svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.2 12 30 12 30s12-9.8 12-18.3C24 5.2 18.6 0 12 0zm0 16.4a4.7 4.7 0 1 1 0-9.4 4.7 4.7 0 0 1 0 9.4z" fill="currentColor"/></svg><span>View on Google Maps</span></a>
        </div>
      </article>

      <article class="fn__page sec--dark" data-fn="shadi" data-scene="shadi" data-petals="6" data-sparkles="12" style="--W:761;--H:1600">
        <div class="art">
          <img data-src="assets/screens/shadi.jpg" width="761" height="1600" alt="Nikah. Shadi. A sacred bond in the sight of Allah." decoding="async">
          <i class="glow" style="--gx:50%;--gy:7.5%;--gs:54"></i>
          <i class="glow" style="--gx:14%;--gy:20%;--gs:26"></i>

</div>

<!-- the only global fixed control -->

</button>
